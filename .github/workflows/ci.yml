# Check, then publish.
#
# checks   builds the platform from code and a seed and verifies it against
#          infra-azure/build.sha256, runs the test suite, then renders every
#          page in a browser and drives the operator's path end to end.
# images   only on main, only after checks pass: builds both images and
#          publishes them to GitHub Container Registry. The backend image
#          rebuilds and re-verifies the data itself, so an image whose output
#          does not match the pinned manifest is never published.
#
# Images are tagged with the short commit SHA - the image_tag Terraform
# deploys - and with latest. The packages are public, so Container Apps pulls
# with no credential; set that once in the package settings after the first
# run. Nothing here holds a cloud credential: deployment is a separate,
# deliberate `terraform apply`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DEMO_WRITE_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pruning hangs while a server started from this job is still alive.
          prune-cache: false

      - name: Build the platform and verify it against the manifest
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python ../scripts/build_platform.py

      - name: Tests
        working-directory: backend
        run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Every page in a browser, then the operator's path
        run: |
          (cd backend && uv run uvicorn src.main:app --port 8061 &)
          (cd frontend && npx vite &)
          for i in $(seq 1 30); do curl -sf http://localhost:8061/health && curl -sf -o /dev/null http://localhost:5261 && break; sleep 1; done
          cd frontend
          BASE=http://localhost:5261 node evals/check-pages.mjs
          BASE=http://localhost:5261 TOKEN=$DEMO_WRITE_TOKEN node evals/flow.mjs
          pkill -f "uvicorn src.main:app" || true
          pkill -f vite || true

  images:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend (rebuilds and verifies the data)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
